<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <style>
        body { background-color: #202020; color: white; font-family: Arial; }
        table { width: 90%; margin: auto; border-collapse: collapse; }
        th, td { padding: 12px; border: 1px solid #444; }
        th { background-color: #444; }
    </style>
</head>
<body>
    <h2 style="text-align: center;">Admin Panel - Move History</h2>
    <table>
        <tr><th>Player</th><th>Card</th><th>Result</th><th>Time</th></tr>
        {% for move in moves %}
        <tr>
            <td>{{ move[0] }}</td>
            <td>{{ move[1] }}</td>
            <td>{{ move[2] }}</td>
            <td>{{ move[3] }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
